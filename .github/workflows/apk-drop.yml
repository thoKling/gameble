name: APK drop (temporary)
on:
  push:
    branches: [ apk-drop ]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build
        working-directory: mobile/android
        run: JAVA_HOME="$JAVA_HOME_17_X64" ./gradlew --no-daemon assembleDebug -PgamebleRootUrl=https://test.gameble.net
      - name: Commit APK
        run: |
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk gameble-debug.apk
          git config user.name "apk-drop"; git config user.email "apk-drop@users.noreply.github.com"
          git add -f gameble-debug.apk && git commit -m "APK" && git push
